services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: personal_changelog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL so the app reaches the db container by service name
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/personal_changelog
    volumes:
      # Mount source so code changes are live without rebuilding
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
